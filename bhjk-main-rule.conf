# ============================================================
# 薄荷健康 开屏广告拦截 —— 主配置 [Rule] 片段
# ============================================================
# 用法：把下面这一整段（不含本注释块）复制到 Loon 主配置
#       配置文件 → [Rule] 段的【最顶部】，即所有 DIRECT / PROXY 规则之前。
#
# 为什么要放最顶部：
#   Loon 插件的 [Rule] 是追加在主配置规则之后的，匹配采用「首条命中」。
#   你主配置里如果有 qq.com,DIRECT 之类更靠前的规则，
#   插件里的 DOMAIN,sdk.e.qq.com,REJECT 就永远轮不到，等于没写。
#   实测证据：同一份插件里 zztfly.com 被成功 404（插件规则生效），
#             而 win.gdt.qq.com 返回真实 200（被前面的 qq.com 规则抢走）。
# ============================================================

# ——— FancyDSP 泛为（本次真凶：static.fancyapi.com 下发 720×1280 FILA 素材）———
